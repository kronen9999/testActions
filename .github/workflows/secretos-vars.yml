name: Secretos y vars de Actions

on:
    push: 
        branches: 
            -main
             
jobs:
    build:
        name: Copia del repo y instalacion de java 17
        runs-on: ubuntu-latest

        steps:
            - name: copiar proyecto
              uses: actions/checkout@v5

            - name: instalar java 17
              uses: actions/setup-java@v5
              with:
                java-version: '17'
                distribution: 'Temurin'
                cache: 'Maven'
    
    
    print-secrets-vars:
        name: Imprimir secretos y variables , requiere el job anterior para funcionar correcatamente
        needs: build
        runs-on: ubuntu-latest

        steps:
          - name: Imprimir secreto 1
            run: echo "El secreto guardado deberia de aparecer con **** secreto=${{secrets.SECRETO_TEST}}"

          - name: Imrpimir variable 1
            run: echo "Imprimiendo variable 1 variable= ${{vars.NOMBRE_PROYECTO}}"